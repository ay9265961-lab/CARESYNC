
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARESYNC | Appointments</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <h1>CARESYNC</h1>
        <p>Appointment Management</p>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="medicines.html">Medicine Tracker</a>
            <a href="login.html">Login</a>
            <button onclick="logoutUser(); window.location.href='login.html';">
                Logout
            </button>
        </nav>
    </header>

    <main class="dashboard">

        <section class="welcome">
            <h2>Appointments</h2>
            <p>Organize and keep track of important appointments.</p>
        </section>

        <section class="feature-card">
            <h3>Schedule an Appointment</h3>

            <form id="appointment-form">

                <label for="appointment-title">
                    Appointment Title
                </label>
                <input
                    type="text"
                    id="appointment-title"
                    required
                >

                <label for="appointment-date">
                    Date and Time
                </label>
                <input
                    type="datetime-local"
                    id="appointment-date"
                    required
                >

                <label for="appointment-notes">
                    Notes
                </label>
                <input
                    type="text"
                    id="appointment-notes"
                >

                <button type="submit">Save Appointment</button>

            </form>

            <p id="appointment-message" role="status"></p>
        </section>

        <section class="feature-card" style="margin-top: 20px;">
            <h3>Your Appointments</h3>

            <button id="load-appointments">
                Refresh Appointments
            </button>

            <div id="appointment-list"></div>
        </section>

    </main>

    <script src="api.js"></script>
    <script src="appointments.js"></script>

</body>
</html>
